name: private_budgeting
description: Private single-owner budgeting. Built at Novacoast.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: any
  supabase: any
  supabase_flutter: any
  http: any
  web: any
  flutter_svg: any
  timezone: any
  yaml: any
dev_dependencies:
  yet_another_json_isolate: any
  crypto: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: any
flutter:
  uses-material-design: true
  assets:
    - config.yaml
    - web/icons/BigB-logo.png
  fonts:
    - family: CircularStd
      fonts:
        - asset: web/assets/fonts/CircularStd-Book.ttf
          weight: 400
        - asset: web/assets/fonts/CircularStd-BookItalic.ttf
          weight: 400
          style: italic
        - asset: web/assets/fonts/CircularStd-Medium.ttf
          weight: 500
        - asset: web/assets/fonts/CircularStd-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: web/assets/fonts/CircularStd-Bold.ttf
          weight: 700
        - asset: web/assets/fonts/CircularStd-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: web/assets/fonts/CircularStd-Black.ttf
          weight: 900
        - asset: web/assets/fonts/CircularStd-BlackItalic.ttf
          weight: 900
          style: italic
