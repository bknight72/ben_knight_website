<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#084828">
  <meta name="description" content="Private budgeting. Built at Novacoast.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/BigB-icon-32.png">
  <link rel="apple-touch-icon" href="icons/BigB-icon-192.png">
  <title>Ben's Budgeteering</title>
  <style>
    @font-face {
      font-family: CircularStd;
      src: url('assets/fonts/CircularStd-Book.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    html, body { margin: 0; background: #f2f6ef; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #f2f6ef;
      color: #142c1b;
      font: 16px CircularStd, sans-serif;
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ceddc6;
      border-top-color: #186818;
      border-radius: 50%;
      animation: loading-spin 1s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; }
    }
  </style>
  <script src="bridge.js" defer></script>
</head>
<body>
  <div id="loading" role="status">
    <div class="loading-spinner" aria-hidden="true"></div>
    <span>Getting coins out of the couch cushions...</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
