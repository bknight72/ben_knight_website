<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#102e2c">
  <meta name="description" content="Private budgeting. Built at Novacoast.">
  <link rel="manifest" href="manifest.json">
  <title>Ben's Budgeteering</title>
  <style>
    html, body { margin: 0; background: #202421; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #202421;
      color: #f4f6f3;
      font: 16px system-ui;
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #637570;
      border-top-color: #c3e9b1;
      border-radius: 50%;
      animation: loading-spin 1s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; }
    }
  </style>
  <script src="bridge.js" defer></script>
</head>
<body>
  <div id="loading" role="status">
    <div class="loading-spinner" aria-hidden="true"></div>
    <span>Getting coins out of the couch cushions...</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
